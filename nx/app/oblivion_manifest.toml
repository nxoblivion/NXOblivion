# nx/app: copied from the repository root oblivion_manifest.toml (2026-11-03, renut-port bootstrap), every function
# entry kept. Paths are relative to nx/app: assets is a junction to the extracted game (nx/tools/link_assets.ps1).
[project]
name = "oblivion"
sdk_version = "0.10.0"
game_root = "assets"

[entrypoint]
file_path = "assets/default.xex"
out_directory_path = "generated/default"
includes = []

# --- Codegen options (2026-11-10): the SDK fork's optimised keys, as katamari-nx / banjo-nx use them. Until now every
# guest register lived in the PPCContext in memory and every function ran the __savegprlr / __restgprlr helpers; on the
# Switch's A57 that is most of the game thread's time (docs/renut-port.md, "The game thread"). Audited for this game
# with nx/tools/codegen_audit (katamari-nx's tools; run them again after any change here or to the function list):
#   python nx/tools/codegen_audit/non_argument_audit.py <generated WITHOUT the keys> --noreturn=828CEE20,828E47F0,828758D8,828F2B58
#   python nx/tools/codegen_audit/read_before_write.py  <generated WITH the keys>   --noreturn=... [--volatile]
#   python nx/tools/codegen_audit/non_argument_audit.py <generated WITH the keys>   --with-option --noreturn=...
# No return: longjmp 0x828CEE20, sub_828E47F0 (ends in XamLoaderLaunchTitle), sub_828758D8 and sub_828F2B58 (error
# functions of a decoder and of the D3DX shader compiler: the code after their calls reads registers nobody set).
# Keys that change how the C++ is written, not what the guest sees:
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
dform_disp_split = true
fctiwz_inline = true
fcti_inline = true
dcbt_prefetch = true
rotate_word_shifts = true
fp_compares_modeless = true
fp_mode_lookahead = true
fp_mode_lookahead_past_branch = true
fp_copy_pairs = true
fp_copy_forwarding = true
div_inline = true
fp_moves_modeless = true
# skip_msr: mfmsr / mtmsrd ("interrupts off") emit nothing. They took the runtime's global recursive mutex twice and
# three full memory barriers around every one. All 1,879 such regions of this game hold one lwarx / stwcx. pair and
# register arithmetic (1,853 increments or decrements, 13 compare-exchanges, 8 adds, 5 exchanges: the XDK's inline
# Interlocked functions, Gamebryo's reference counts), which the generated compare-and-swap makes atomic by itself.
skip_msr = true
# plain_guest_accesses (this tree's generator, after the upstream ports' pch_no_volatile.py + loop_barriers.py): guest
# loads and stores through plain pointers instead of volatile ones (memory-mapped I/O keeps volatile), so the compiler
# keeps values in registers, pairs accesses and drops repeated loads; every loop header of the generated code (27,862
# of its 185,409 labels) gets a compiler barrier over the guest's memory, so a loop that waits for another thread to
# change a word reads it again on every turn. The Switch build takes no memory fault in play (rex_profile.log:
# "faults/s ... 0"), so nothing depends on the shape of the load and store instructions.
plain_guest_accesses = true
# The register "diet": r14-r31, f14-f31, v14-v31 as C++ locals (no save / restore helpers, no guest-stack traffic for
# them); no `ctx.lr = <return address>` before every call; r0, r2, r11, r12, f0, v32-v63 as locals.
#   - read_before_write.py on code with the keys: setjmp and its 7 callers (the generator's own environment save), one
#     unreachable one-instruction fragment (sub_828E1EE4); no split piece reads a register of its parent's. The
#     exception funclets (`addi r31,r12,-N`) keep their registers in the context by themselves, their callers copy them.
#   - v64-v127 stay in the context in every function: sub_8271F3D0 reads v126 and sub_827551D0 v123-v125 without ever
#     writing them (a value of their callers'), as katamari-nx found for its movie codec.
#   - non_argument_audit.py: ENTRY = the 215 save / restore helpers (kept by name) and the 133 functions below (132
#     exception funclets and stack helpers taking r12, and sub_828DE5F8, which reads the r11 its __finally funclet
#     sub_828DE6C0 sets); with the keys: HANDOVER only sub_82487AA0 -> sub_824C59F0's saved environment (not a use).
non_volatile_as_local = true
non_volatile_as_local_keep = ["v64-v127"]
elide_lr_stores = true
non_argument_as_local = true
# setjmp saves f14-f31, r13-r31, LR, CR and r1 into the buffer at r3 (`stfd f14,0(r3)` ... `std r13,152(r3)`) after a
# check of a hook word; longjmp reloads them (`mr r7,r3` ... `lfd f14,0(r7)`). 7 functions call setjmp, 20 sites longjmp.
setjmp_address = 0x828CF200
longjmp_address = 0x828CEE20
