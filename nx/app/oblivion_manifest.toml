# reOblivion (2026-11-19): the mouse looks around as on the PC. The player's look update (sub_82417860, PlayerCharacter
# slot 0x8A) turns the right stick into the PC's mouse counts (r20 across, r19 down: + right and + down, before the
# bInvertYValues flip) and turns the player by counts * fMouseSensitivity, the PC's own formula. The hook adds the
# mouse's counts there (src/oblivion_mouse_look.cpp), past the stick's dead zone and acceleration curve, and before
# the check that zeroes them while the controls are disabled.
[[entrypoint.midasm_hook]]
address = 0x82418024
name = "OblivionMouseLookHook"
registers = ["r20", "r19"]
